# Construit un APK de test à chaque push (ou à la demande depuis l'onglet Actions).
# L'APK se télécharge depuis la page « Releases » du dépôt (version « test »), directement sur le téléphone.
name: APK Android de test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Le SDK Android est déjà sur les machines GitHub ; on ajoute les versions utilisées par l'app (3 essais si un téléchargement échoue).
      - name: Composants Android
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          for i in 1 2 3; do
            yes | $SDKM --install "ndk;27.1.12297006" "platforms;android-37.0" "build-tools;37.0.0" "build-tools;36.0.0" "cmake;3.22.1" > /dev/null && break
            echo "Nouvel essai ($i)"; rm -rf $ANDROID_HOME/ndk/27.1.12297006; sleep 10
          done
          ls $ANDROID_HOME/ndk/27.1.12297006/source.properties
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: cp android/app/build/outputs/apk/release/app-release.apk copilote-gps-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: copilote-gps-apk
          path: copilote-gps-test.apk
      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test --yes --cleanup-tag || true
          gh release create test copilote-gps-test.apk --title "APK de test" --notes "Version du $(date -u +%d/%m/%Y) (commit ${GITHUB_SHA::7}). Ouvrez ce lien sur le téléphone et touchez copilote-gps-test.apk."
